<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/home">
      Weather&amp;Go
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/home', activeLocationId]" routerLinkActive="active">
            Inicio
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/list', activeLocationId]" routerLinkActive="active">
            Predicción
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/list-table', activeLocationId]" routerLinkActive="active">
            Comparativa
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/recommendations', activeLocationId]" routerLinkActive="active">
            Recomendaciones
          </a>
        </li>
      </ul>

      <form class="search-location-form" (ngSubmit)="searchLocation()">
        <div class="search-location-wrapper">
          <input
            class="form-control"
            type="search"
            name="searchText"
            [(ngModel)]="searchText"
            (input)="onSearchTextChange()"
            (blur)="hideSuggestionsLater()"
            placeholder="Buscar ubicación"
            aria-label="Buscar ubicación"
            autocomplete="off">

          <div class="location-suggestions" *ngIf="showSuggestions">
            <button
              type="button"
              class="location-suggestion"
              *ngFor="let suggestion of suggestions"
              (click)="selectSuggestion(suggestion)">
              {{ suggestion.name }}
            </button>
          </div>
        </div>

        <button class="btn btn-outline-info" type="submit" [disabled]="loading">
          Buscar
        </button>
      </form>
    </div>
  </div>
</nav>
